<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>EnotecaMolise Wine Importer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { width: 420px; min-height: 560px; background-color: #fcfbf9; color: #1c1917; padding: 16px; font-size: 13px; }
    .header { display: flex; items-center; justify-content: space-between; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid #e7e5e4; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #581c26; font-size: 15px; }
    .brand span { background: #581c26; color: white; padding: 2px 6px; border-radius: 6px; font-size: 10px; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    
    .card { background: white; border-radius: 12px; border: 1px solid #e7e5e4; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .card-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #78716c; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: #44403c; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid #d6d3d1; border-radius: 8px; padding: 8px 10px; font-size: 12px; background: white; color: #1c1917; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #581c26; box-shadow: 0 0 0 2px rgba(88,28,38,0.15); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .presets { display: flex; gap: 4px; margin-bottom: 8px; }
    .btn-preset { flex: 1; padding: 4px 6px; font-size: 10px; font-weight: 700; border-radius: 6px; border: 1px solid #d6d3d1; background: #f5f5f4; cursor: pointer; color: #44403c; }
    .btn-preset.active { background: #581c26; color: white; border-color: #581c26; }

    .preview-img { width: 50px; h-50px; height: 50px; object-fit: contain; background: #f5f5f4; border-radius: 8px; border: 1px solid #e7e5e4; }
    .img-field-group { display: flex; gap: 8px; align-items: center; }

    .btn-submit { width: 100%; padding: 12px; background: #581c26; color: white; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 4px rgba(88,28,38,0.2); transition: all 0.2s; }
    .btn-submit:hover { background: #42141c; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-rescrape { font-size: 10px; color: #581c26; font-weight: 700; cursor: pointer; background: none; border: none; text-decoration: underline; }

    .toast-container { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast-card { pointer-events: auto; padding: 10px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2), 0 4px 6px -2px rgba(0,0,0,0.05); backdrop-filter: blur(8px); animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; transition: all 0.3s ease; }
    .toast-card.toast-success { background: rgba(240, 253, 244, 0.96); color: #14532d; border: 1px solid #bbf7d0; }
    .toast-card.toast-error { background: rgba(254, 242, 242, 0.96); color: #7f1d1d; border: 1px solid #fecaca; }
    .toast-card.toast-info { background: rgba(240, 249, 255, 0.96); color: #0c4a6e; border: 1px solid #bae6fd; }
    .toast-card.toast-warning { background: rgba(254, 252, 232, 0.96); color: #713f12; border: 1px solid #fef08a; }
    .toast-card.fade-out { opacity: 0; transform: translateY(-10px) scale(0.95); }
    @keyframes toastSlideIn { from { opacity: 0; transform: translateY(-12px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      🍷 EnotecaMolise <span>CLIpper</span>
    </div>
    <div class="status-badge" id="api-status">API Collegata</div>
  </div>

  <!-- Cantina Selector -->
  <div class="card" style="background: #fffbeb; border-color: #fde68a;">
    <div class="field" style="margin-bottom: 0;">
      <label style="color: #92400e;">1. SELEZIONA CANTINA PRODUTTRICE *</label>
      <select id="producer_id">
        <option value="" disabled selected>Caricamento cantine dal database...</option>
      </select>
    </div>
  </div>

  <!-- Main Wine Form -->
  <form id="wine-form">

    <div class="card">
      <div class="card-title">
        <span>2. Dettagli Generali Bottiglia</span>
        <button type="button" id="btn-rescrape" class="btn-rescrape">🔄 Riscansiona Pagina</button>
      </div>

      <div class="field">
        <label>Nome Vino / Etichetta *</label>
        <input type="text" id="name" required placeholder="es. Biferno Rosso Riserva DOC" />
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Tipologia *</label>
          <select id="category">
            <option value="VINO_ROSSO">Vino Rosso</option>
            <option value="VINO_BIANCO">Vino Bianco</option>
            <option value="ROSATO">Rosato</option>
            <option value="SPUMANTE">Spumante</option>
            <option value="PASSITO">Passito</option>
            <option value="LIQUORE">Liquore / Grappa</option>
          </select>
        </div>
        <div class="field">
          <label>Denominazione *</label>
          <input type="text" id="denominazione" required value="DOC" />
        </div>
      </div>

      <!-- Annata & Riserva -->
      <div class="field">
        <label>Annata Vendemmia & Riserva</label>
        <div class="presets">
          <button type="button" class="btn-preset" id="preset-annata">Annata</button>
          <button type="button" class="btn-preset" id="preset-riserva">Annata + Riserva</button>
          <button type="button" class="btn-preset" id="preset-solo-riserva">Solo Riserva</button>
          <button type="button" class="btn-preset" id="preset-sa">Senza Annata</button>
        </div>

        <div class="grid-2" style="align-items: center;">
          <input type="number" id="vintage_year" placeholder="es. 2022 (opzionale)" />
          <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 0; cursor: pointer;">
            <input type="checkbox" id="is_riserva" style="width: auto;" />
            <span>Riserva</span>
          </label>
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label>Alcol (% Vol)</label>
          <input type="number" step="0.1" id="alcohol_degrees" placeholder="es. 14.0" />
        </div>
        <div class="field">
          <label>Temperatura</label>
          <input type="text" id="serving_temperature" value="16-18°C" />
        </div>
        <div class="field">
          <label>Prezzo Indicativo</label>
          <input type="text" id="indicative_price" placeholder="es. 18.00€" />
        </div>
      </div>
    </div>

    <!-- Description & Grapes -->
    <div class="card">
      <div class="card-title">3. Vitigni & Descrizione</div>
      
      <div class="field">
        <label>Uvaggio / Vitigni</label>
        <input type="text" id="grape_varieties" placeholder="es. Tintilia 100% oppure Montepulciano 80%" />
      </div>

      <div class="field">
        <label>Descrizione Vino & Storia</label>
        <textarea id="description" rows="2" placeholder="Descrizione estratta dal sito..."></textarea>
      </div>
    </div>

    <!-- Media Links -->
    <div class="card">
      <div class="card-title">4. Immagine & PDF</div>
      
      <div class="field">
        <label>URL Immagine Bottiglia</label>
        <div class="img-field-group">
          <img id="img-preview" src="https://images.unsplash.com/photo-1586370434639-0fe43b2d32e6?auto=format&fit=crop&w=100&q=80" class="preview-img" />
          <input type="text" id="photo_url" placeholder="https://..." style="flex: 1;" />
        </div>
      </div>

      <div class="field">
        <label>Link Scheda PDF (Opzionale)</label>
        <input type="text" id="technical_sheet_pdf" placeholder="https://.../scheda.pdf" />
      </div>
    </div>

    <!-- Action -->
    <button type="submit" id="btn-submit" class="btn-submit">
      🚀 IMPORTA VINO IN ENOTECAMOLISE
    </button>

  </form>

  <script src="popup.js"></script>
</body>
</html>
