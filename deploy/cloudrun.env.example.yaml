# Variabili d'ambiente del BACKEND su Google Cloud Run.
# 1) Copia questo file in deploy/cloudrun.env.yaml (e' escluso da git) e completa i valori <...>
# 2) Usalo con: gcloud run deploy ... --env-vars-file deploy/cloudrun.env.yaml
# Tutti i valori vanno tra virgolette. Non pubblicare mai il file compilato.

# --- Database (MongoDB Atlas) ---------------------------------------------
# Stessa stringa del .env locale, oppure un utente Atlas dedicato al sito online.
MONGODB_URL: "mongodb+srv://<utente>:<password>@cluster0.fve8hpt.mongodb.net/?retryWrites=true&w=majority"
# Stesso nome del locale = il sito online vede gli stessi dati dello sviluppo.
DATABASE_NAME: "enoteca_molise"

# --- Sicurezza --------------------------------------------------------------
# OBBLIGATORIA, almeno 32 caratteri, diversa da quella di sviluppo. Generala con:
#   python -c "import secrets; print(secrets.token_urlsafe(64))"
# Se cambia, tutti devono rifare l'accesso.
SECRET_KEY: "<chiave casuale lunga>"
ACCESS_TOKEN_EXPIRE_MINUTES: "4320"

# --- Indirizzi --------------------------------------------------------------
# Indirizzo del frontend su Vercel (poi il dominio vero), senza / finale.
# CORS_ORIGINS accetta piu' indirizzi separati da virgola.
CORS_ORIGINS: "https://<progetto>.vercel.app"
SITE_URL: "https://<progetto>.vercel.app"

# --- File caricati (loghi, foto, PDF) --------------------------------------
# Il disco di Cloud Run si azzera a ogni riavvio: le foto vanno in un bucket
# Cloud Storage montato in questa cartella (vedi deploy/LEGGIMI.md).
UPLOAD_DIR: "/mnt/uploads"

# --- Amministratore -----------------------------------------------------------
# Usati solo se nel database NON esiste ancora un amministratore.
ADMIN_EMAIL: "admin@enotecamolise.it"
ADMIN_PASSWORD: ""

# --- Cantine ------------------------------------------------------------------
AUTO_APPROVE_PRODUCERS: "false"
SEED_SAMPLE_DATA: "false"
INVITE_TTL_DAYS: "14"
PASSWORD_RESET_TTL_MINUTES: "60"

# --- Email ----------------------------------------------------------------------
# Finche' non c'e' il dominio: "outbox" (le email restano in Area riservata > Posta in uscita).
# Con il dominio: "smtp" e i dati del provider. La porta 25 su Cloud Run e' bloccata: usa 587 o 465.
EMAIL_MODE: "outbox"
SMTP_HOST: ""
SMTP_PORT: "587"
SMTP_USER: ""
SMTP_PASSWORD: ""
SMTP_SECURITY: "starttls"

# --- Importazione schede con IA -------------------------------------------------
# Basta una delle due chiavi (la stessa del .env locale va bene).
AI_PROVIDER: "auto"
GEMINI_API_KEY: "<chiave Gemini>"
GEMINI_MODEL: "gemini-3.8-flash"
GEMINI_FALLBACK_MODELS: "gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite"
ANTHROPIC_API_KEY: ""
AI_TIMEOUT_SECONDS: "180"
PRODUCER_AI_FILES_PER_DAY: "20"
PRODUCER_AI_FILES_PER_BATCH: "10"
